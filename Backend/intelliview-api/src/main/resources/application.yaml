spring:
  application:
    name: intelliview-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 86400000 ms = 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

intelliview:
  ai:
    provider: ${INTELLIVIEW_AI_PROVIDER:placeholder}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
      request-timeout: ${GEMINI_REQUEST_TIMEOUT:60s}